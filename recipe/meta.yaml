{% set name = "robotframework-mqttlibrary" %}
{% set version = "0.7.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: d74c07c7895c75b8b2b573f080e73edd5f00da3e9910f2ab829dcaa7b93c0f2e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - python >=3.6
    - robotframework
    - paho-mqtt

test:
  imports:
    - MQTTLibrary
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/randomsync/robotframework-mqttlibrary
  summary: MQTT Keyword Library Robot Framework
  doc_url: https://pythonhosted.org/robotframework-mqttlibrary/
  license: Apache-2.0
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - nisharai1
