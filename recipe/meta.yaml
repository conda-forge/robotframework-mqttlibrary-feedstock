{% set name = "robotframework-mqttlibrary" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: d5e10fad49aedc20535a7da416cc574b6bfcd4e609cdb37d33b243b0367914e6

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - python >=3.6
    - robotframework
    - paho-mqtt

test:
  imports:
    - MQTTLibrary
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/randomsync/robotframework-mqttlibrary
  summary: MQTT Keyword Library Robot Framework
  doc_url: https://pythonhosted.org/robotframework-mqttlibrary/
  license: Apache-2.0
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - nisharai1
